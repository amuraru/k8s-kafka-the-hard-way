    .kafka-card { fill: #eaf2ff; stroke: #7097cc; }
    .monitor-card { fill: #e8f6f1; stroke: #6b9f8d; }
    .alert-card { fill: #fff1e8; stroke: #bf906f; }
    .rule { stroke: #d3deeb; }
    .flow { fill: none; stroke-width: 2.5; stroke-linejoin: round; }
    .data { stroke: #1a53ab; }
    .control { stroke: #983c13; stroke-dasharray: 6 3.5; }
    .metrics { stroke: #07634f; stroke-dasharray: 1 4; stroke-linecap: round; }
    .data-head { marker-end: url(#data-arrow); }
    .control-head { marker-end: url(#control-arrow); }
    .metrics-head { marker-end: url(#metrics-arrow); }
    .data-text { fill: #1a53ab; }
    .control-text { fill: #983c13; }
    .metrics-text { fill: #07634f; }
  </style>
