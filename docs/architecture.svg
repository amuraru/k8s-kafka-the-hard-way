<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1320" viewBox="0 0 840 1320" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">Kafka on a local kind cluster</title>
  <desc id="architecture-desc">
    Docker runs seven kind nodes on one laptop. One node runs the Kubernetes control plane.
    Six workers share three simulated zones, with two configured Kafka brokers per zone.
    In-cluster clients bootstrap through kafka-headless:29092, then produce and consume on the brokers.
    Kafka copies partition data across racks and stores cluster metadata in three ZooKeeper members.
    Brokers and ZooKeeper members each use a separate local-path persistent volume claim.
    KOperator manages Kafka brokers and topics, and calls Cruise Control. Cruise Control reads the brokers' metrics topic and uses the Kafka Admin API.
    The ZooKeeper operator manages ZooKeeper. cert-manager provides certificates. KOperator's admission webhook is off.
    Prometheus Operator configures Prometheus, which scrapes Kafka and Cruise Control JMX Exporters, ZooKeeper, KMinion, node-exporter, and kube-state-metrics.
    KMinion reads the Kafka Admin API. The Grafana sidecar loads Kafka Looking Glass from a ConfigMap. Grafana queries Prometheus.
    If the sample scaling rules are applied, Prometheus sends alerts to Alertmanager, which calls KOperator's alert webhook.
    The monitoring chart manages its own admission certificates. Dashboard access uses loopback port forwards.
  </desc>
