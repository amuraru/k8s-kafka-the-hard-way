    </marker>
    <marker id="control-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5 0 10Z" fill="#983c13"/>
    </marker>
    <marker id="metrics-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5 0 10Z" fill="#07634f"/>
    </marker>
  </defs>

  <rect width="840" height="1320" fill="#fff"/>
