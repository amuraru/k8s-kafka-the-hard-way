  <text class="badge" x="44" y="120">01</text>
  <text class="heading" x="72" y="121">Laptop</text>
  <text class="label" x="796" y="120" text-anchor="end">Docker runs each kind node as a container. Colima can run Docker.</text>
  <rect class="card" x="36" y="133" width="768" height="149" rx="9"/>
  <text class="name" x="50" y="157">kind cluster: kafka</text>
  <text class="small mono" x="225" y="157">kind-kafka</text>
  <text class="label" x="788" y="157" text-anchor="end">region1 · 3 simulated zones · 7 nodes</text>

